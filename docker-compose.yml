# Payment Ops Analytics — full stack.   python opa.py up   (or: docker compose up -d --build)
x-app: &app
  build: .
  image: opanalytics-app:latest
  restart: unless-stopped
  environment:
    DATABASE_URL: postgresql://opa:opa@postgres:5432/opanalytics
    GATEWAY_URL: http://gateway:8000
    PROVIDERS_URL: http://providers:8001
    TRAFFIC_URL: http://traffic:8002
    DETECTOR_URL: http://detector:8003
    ADMINER_URL: http://adminer:8080
    WATCHFILES_FORCE_POLLING: "true"
  volumes:            # live code reload: edit ./app on the host, services restart automatically
    - ./app:/srv/app
    - ./sql:/srv/sql
    - ./tests:/srv/tests
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: opa
      POSTGRES_PASSWORD: opa
      POSTGRES_DB: opanalytics
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opa -d opanalytics"]
      interval: 3s
      retries: 30

  providers:
    <<: *app
    command: uvicorn opanalytics.services.providers:app --host 0.0.0.0 --port 8001 --reload --reload-dir /srv/app
    ports: ["8001:8001"]

  gateway:
    <<: *app
    command: uvicorn opanalytics.services.gateway:app --host 0.0.0.0 --port 8000 --reload --reload-dir /srv/app
    ports: ["8000:8000"]

  traffic:
    <<: *app
    command: uvicorn opanalytics.services.traffic:app --host 0.0.0.0 --port 8002 --reload --reload-dir /srv/app
    ports: ["8002:8002"]

  detector:
    <<: *app
    command: uvicorn opanalytics.services.detector:app --host 0.0.0.0 --port 8003 --reload --reload-dir /srv/app
    ports: ["8003:8003"]

  dashboard:
    <<: *app
    command: uvicorn opanalytics.services.dashboard:app --host 0.0.0.0 --port 8080 --reload --reload-dir /srv/app
    ports: ["8080:8080"]

  adminer:
    image: adminer:latest
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports: ["8081:8080"]

  metabase:          # optional free BI (Tableau alternative):  python opa.py up --bi
    image: metabase/metabase:latest
    profiles: ["bi"]
    ports: ["3000:3000"]
    volumes:
      - metabase:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db

volumes:
  pgdata:
  metabase:
